# Coherence checks itself on every pull request and every push to main: the
# typecheck, the unit tests (in two shards), the lexicon and spec checks (what
# npm test runs), and a
# chokepoint run over Coherence's own invariants. A test proves code behaves;
# only the chokepoint run proves no code reaches around a declared door, and
# without it a bypass reached main with every test green (df-5961bdb2).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never sends telemetry, whatever a user config on the runner says.
env:
  COHERENCE_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  # The unit tests, split by file across two runners: the suite is bound by
  # the runner's cores, so two shards take about half the wall time of one.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: unit (${{ matrix.shard }}/2)
    steps:
      # Full history: a practice's pitfalls may cite commits, and the spec check confirms each exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18"

      - name: Install
        run: npm ci

      # The language servers the adapters ask: neither is a dependency of the package, so an adopter brings its own.
      - name: Language servers
        run: npm install --global typescript-language-server@5.1.3 typescript@5.9.2 pyright@1.1.413

      # The Python test runner and tach, into .venv, where the tests look for them.
      - name: Python test tools
        run: npm run test:setup

      # The Rust adapter's server: no npm package, and no default component of the runner's toolchain. A missing one fails rust.test.ts.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rust-analyzer, rust-src

      # Some fixtures commit to throwaway repositories.
      - name: Git identity
        run: |
          git config --global user.email "ci@coherence.invalid"
          git config --global user.name "Coherence CI"

      - name: Unit tests
        env:
          COHERENCE_TEST_SHARD: ${{ matrix.shard }}/2
        run: npm run test:unit

  # Everything in npm test but the unit tests, beside them, and the chokepoint run.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: a practice's pitfalls may cite commits, and the spec check confirms each exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18"

      - name: Install
        run: npm ci

      # The records are folded in the diff (.gitattributes); the job summary says what they hold.
      - name: Records summary
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/records-summary.mjs "$BASE" "$HEAD" >> "$GITHUB_STEP_SUMMARY"

      # The language servers the adapters ask: neither is a dependency of the package, so an adopter brings its own.
      - name: Language servers
        run: npm install --global typescript-language-server@5.1.3 typescript@5.9.2 pyright@1.1.413

      # The Python test runner and tach, into .venv, where the tests look for them.
      - name: Python test tools
        run: npm run test:setup

      # Some fixtures commit to throwaway repositories.
      - name: Git identity
        run: |
          git config --global user.email "ci@coherence.invalid"
          git config --global user.name "Coherence CI"

      - name: Typecheck, lexicon and spec checks
        run: npm run -s typecheck && npm run -s lexicon:check && npm run -s spec:check

      # Every chokepoint graded in-process (no warm server); a broken one fails the run.
      - name: Chokepoints
        run: node --disable-warning=ExperimentalWarning src/cli.ts run --form chokepoint --no-server --session "ci-${{ github.run_id }}" --agent ci

  # One check that stands for the rest: green only when every shard and the checks are.
  verify:
    if: always()
    needs: [unit, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard and check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  # One session's hooks over a synthetic monorepo of about 5,000 files under a
  # registry of three products, warm-up on: each event's wall time against
  # bench/scale/budgets.json, set a few times above what these runners
  # measure, so an order-of-magnitude regression fails and noise does not.
  # The timings go to the job summary.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18"

      # The optional dependencies bring the TypeScript language server and Pyright the edits ask.
      - name: Install
        run: npm ci

      - name: Scale benchmark
        run: node --disable-warning=ExperimentalWarning bench/scale/run.ts

      # The prefilter over Coherence's own tree, read both ways: the unit suite proves it on fixtures; this reads the whole tree twice, so it lives here, out of the unit suite's time.
      - name: Prefilter over Coherence's own tree
        run: node --disable-warning=ExperimentalWarning bench/interfaces/own-tree.ts
